plugins {
    // Minecraft 26.x is unobfuscated, so this is the non-"remap" Loom plugin.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/saintsdragons.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // In 26.x mods are no longer remapped, so plain "implementation" is used (not "modImplementation").
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

    // Parked for later (see _parked/ and PORTING_NOTES.md): Cloth Config, JEI, EMI, Jade, ModMenu.
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraft_version: project.minecraft_version,
                fabric_loader_version: project.loader_version,
                fabric_api_version: project.fabric_api_version,
                geckolib_version: project.geckolib_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    // Show ALL compile errors at once (the default stops at 100), so we can fix them in big batches.
    it.options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    archiveFileName.set("saintsdragons-${project.version}+fabric-${project.minecraft_version}.jar")
}
